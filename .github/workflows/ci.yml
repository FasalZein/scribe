name: CI
# Run only when code, build inputs, tests, workflows or the skill version can change the result.
on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/**"
      - "skills/scribe/SKILL.md"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/**"
      - "skills/scribe/SKILL.md"
# A newer push to the same branch cancels the run still going for an older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  # Same CPU flags as the release build.
  TRANSCRIBE_CMAKE_ARGS: -DGGML_NATIVE=OFF
jobs:
  build-and-test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check that the skill version matches Cargo.toml
        shell: bash
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          skill=$(sed -n 's/^  version: "\(.*\)"/\1/p' skills/scribe/SKILL.md | head -n 1)
          test "$crate" = "$skill" || { echo "skills/scribe/SKILL.md version $skill != Cargo.toml $crate"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake g++
      - run: cargo build --locked
      - run: cargo test --locked
