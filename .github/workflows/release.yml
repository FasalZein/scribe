name: Release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
env:
  # Explicit CPU tiers: no -march=native from the build machine.
  TRANSCRIBE_CMAKE_ARGS: -DGGML_NATIVE=OFF
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin, suffix: '', optional: false }
          # Linux tiers live here. Each gets a fresh build/cache in the same
          # manylinux_2_28 image (AlmaLinux 8, glibc 2.28 and gcc-toolset).
          # ggml enables x86 extensions by default even with GGML_NATIVE=OFF;
          # use the conservative option to disable every x86 SIMD tier by default.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, suffix: '', platform: linux/amd64, image: quay.io/pypa/manylinux_2_28_x86_64, cpu_flags: '-DTRANSCRIBE_X86_CONSERVATIVE=ON', optional: false }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, suffix: '-avx2', platform: linux/amd64, image: quay.io/pypa/manylinux_2_28_x86_64, cpu_flags: '-DGGML_SSE42=ON -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_BMI2=ON -DGGML_AVX_VNNI=OFF -DGGML_AVX512=OFF', optional: false }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, suffix: '', platform: linux/arm64, image: quay.io/pypa/manylinux_2_28_aarch64, cpu_flags: '', optional: false }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, suffix: '-dotprod', platform: linux/arm64, image: quay.io/pypa/manylinux_2_28_aarch64, cpu_flags: '-DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod+fp16', optional: false }
          # Windows is optional: a failed build does not block the release.
          - { os: windows-latest, target: x86_64-pc-windows-msvc, suffix: '', optional: true }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Linux'
      - name: Read version and check release tags
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != Cargo.toml v$version"; exit 1; }
            skill=$(sed -n 's/^  version: "\(.*\)"/\1/p' skills/scribe/SKILL.md | head -n 1)
            test "$skill" = "$version" || { echo "skills/scribe/SKILL.md version $skill != Cargo.toml $version"; exit 1; }
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build Linux CPU tier
        if: runner.os == 'Linux'
        run: |
          docker run --rm --platform '${{ matrix.platform }}' \
            -e CPU_FLAGS='${{ matrix.cpu_flags }}' \
            -v "$PWD:/src" -w /src '${{ matrix.image }}' bash -euo pipefail -c '
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
              export PATH=/root/.cargo/bin:$PATH
              export TRANSCRIBE_CMAKE_ARGS="-DGGML_NATIVE=OFF -DTRANSCRIBE_USE_SYSTEM_BLAS=OFF $CPU_FLAGS"
              # The crate manifest emits dylib=stdc++; rustc -l overrides its kind.
              # CXXSTDLIB is not read by this crate. gcc_eh resolves unwinding
              # before Rust can pull in libgcc_s; glibc itself stays dynamic.
              export RUSTFLAGS="-L native=$(dirname "$(g++ -print-file-name=libstdc++.a)") -l static=stdc++ -l static=gcc_eh -C link-arg=-static-libgcc"
              cargo build --release --locked
            '
      - name: Check Linux binary on clean systems
        if: runner.os == 'Linux'
        run: scripts/portable-check.sh target/release/scribe '${{ matrix.platform }}'
      - run: cargo build --release --locked
        if: runner.os == 'macOS'
      - name: Build Windows binary with static CRT
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: -C target-feature=+crt-static
          TRANSCRIBE_CMAKE_ARGS: -DGGML_NATIVE=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
        run: cargo build --release --locked
      - name: Check Windows runtime dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$installation) { throw "Visual Studio C++ tools not found" }
          $dumpbin = Get-ChildItem "$installation\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (!$dumpbin) { throw "dumpbin.exe not found" }
          $dependencies = & $dumpbin.FullName /dependents target/release/scribe.exe
          if ($LASTEXITCODE -ne 0) { throw "dumpbin /dependents failed" }
          $dependencies | Write-Output
          # Reject the VC runtime and Universal CRT DLLs, including versioned helpers.
          if ($dependencies -match '(?i)\b(?:VCRUNTIME140[\w-]*|MSVCP140[\w-]*|api-ms-win-crt-[\w-]+|ucrtbase)\.dll\b') {
            throw "scribe.exe depends on a separately installed C/C++ runtime"
          }
          & ./target/release/scribe.exe --version
          if ($LASTEXITCODE -ne 0) { throw "scribe.exe --version failed" }
      - name: Package (macOS, Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name=scribe-$VERSION-${{ matrix.target }}${{ matrix.suffix }}.tar.gz
          mkdir dist
          cp target/release/scribe LICENSE dist/
          tar -czf "$name" -C dist scribe LICENSE
          shasum -a 256 "$name" > "$name.sha256"
          cat "$name.sha256"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "scribe-$env:VERSION-${{ matrix.target }}.zip"
          Compress-Archive -Path target/release/scribe.exe, LICENSE -DestinationPath $name
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -Encoding ascii -NoNewline "$name.sha256"
          Get-Content "$name.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: scribe-${{ matrix.target }}${{ matrix.suffix }}
          path: scribe-*-${{ matrix.target }}${{ matrix.suffix }}.*
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: scribe-*
          merge-multiple: true
          path: dist
      - run: ls -l dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* -R "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
