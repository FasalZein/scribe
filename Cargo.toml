[package]
name = "scribe"
version = "0.2.1"
edition = "2024"
description = "Turn media files and video URLs into timestamped transcripts"
license = "MIT"

[features]
vulkan = ["transcribe-cpp/vulkan"]
cuda = ["transcribe-cpp/cuda"]

[dependencies]
anyhow = "1"
log = "0.4"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
ureq = { version = "2", features = ["proxy-from-env", "native-certs"] }
time = { version = "0.3", features = ["formatting"] }
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
transcribe-cpp = { version = "=0.3.1", default-features = false, features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
transcribe-cpp = { version = "=0.3.1", default-features = false }
